name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate YAML schemas
        run: |
          npx ajv-cli@5 validate -s schemas/capability.schema.json -d "capabilities/*.yaml" --spec=draft2020
          npx ajv-cli@5 validate -s schemas/rule-pack.schema.json -d "packs/*.yaml" --spec=draft2020

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4

      - name: Vulnerability scan
        # govulncheck@latest can require a newer Go than go.mod pins, and
        # newer actions/setup-go releases set GOTOOLCHAIN=local, which
        # blocks the automatic toolchain download.
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
