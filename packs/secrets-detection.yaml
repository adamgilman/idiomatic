# yaml-language-server: $schema=../schemas/rule-pack.schema.json
apiVersion: rules.idiomatic.dev/v1alpha1
kind: RulePack

pack:
  id: secrets-detection
  name: Secrets Detection
  version: 0.1.0
  description: >
    Secret detection rules powered by gitleaks. Catches API keys,
    passwords, tokens, private keys, and other credentials before they
    are committed to version control.
  descriptions:
    business: >
      Leaked credentials are the number one cause of cloud security
      breaches. A single API key in a Git commit can be exploited within
      minutes by automated scanners. This pack catches secrets before they
      reach version control — AWS keys, database passwords, JWT secrets,
      private keys, and more. It's cheaper to catch a secret in code review
      than to rotate every credential after a breach.
    developer: >
      This pack wraps gitleaks, the industry-standard secret scanner. Each
      rule maps to a gitleaks built-in detection pattern. The pack adds our
      own descriptions, rationale, and fix guidance on top of gitleaks'
      proven regex patterns — you get battle-tested detection plus
      actionable remediation advice.
  maintainer: idiomatic
  license: Proprietary
  homepage: https://github.com/adamgilman/idiomatic/blob/main/packs/secrets-detection.yaml
  tags:
    vendor: gitleaks
    category: security
    architecture: [services, workers, pipelines, libraries, serverless]

rules:
  # ── Cloud Provider Keys ────────────────────────────────────────

  - id: secrets-aws-access-key
    name: AWS access key ID detected
    description: >
      Flags AWS access key IDs (starting with AKIA, AIDA, AROA, etc.)
      found in source code.
    descriptions:
      business: >
        An AWS master key was found in the code. This is like leaving your
        cloud account password in a public document. Automated scanners
        find leaked AWS keys within minutes and use them to spin up crypto
        miners, access your data, or rack up massive bills. A single
        leaked key has caused six-figure AWS charges.
      developer: >
        An AKIA/AIDA/AROA prefix key was detected. These are long-lived
        IAM credentials that grant programmatic access to your AWS account.
        Use IAM roles (instance profiles, task roles) or environment
        variables via the default credential chain instead.
    rationale: >
      AWS access key IDs are long-lived credentials that grant programmatic
      access to your AWS account. Committing them to version control puts
      them in git history permanently. Automated bots scan GitHub for AKIA
      prefixes and exploit them within minutes. AWS reports credential
      leakage as the #1 cause of cloud security incidents.
    severity: error
    tags: [secrets, aws, credentials]
    detector:
      capability: gitleaks
      config:
        rule_id: aws-access-token
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**"]
    fix:
      message: Remove the key from source code. Use IAM roles or environment variables.
      example: |
        // Before — key in source code
        aws_access_key_id = "AKIAIOSFODNN7EXAMPLE"

        // After — from environment
        aws_access_key_id = os.Getenv("AWS_ACCESS_KEY_ID")
    references:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
      - https://github.com/gitleaks/gitleaks

  - id: secrets-aws-secret-key
    name: AWS secret access key detected
    description: >
      Flags AWS secret access keys found in source code.
    descriptions:
      business: >
        The secret half of an AWS credential pair was found in your code.
        Combined with an access key, this gives full access to whatever
        AWS services the key is authorized for — databases, storage,
        compute, everything. This must be removed and the key rotated
        immediately.
      developer: >
        An AWS secret access key was detected in source. Even if the
        corresponding access key has been rotated, this secret persists in
        git history. Remove it, rotate the credential, and audit CloudTrail
        logs for unauthorized usage.
    rationale: >
      The secret access key is the private half of an AWS credential pair.
      With both the access key ID and secret, an attacker has full
      programmatic access to your AWS account. Secrets in git history
      persist even after the file is deleted.
    severity: error
    tags: [secrets, aws, credentials]
    detector:
      capability: gitleaks
      config:
        rule_id: aws-secret-access-key
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**"]
    fix:
      message: Remove and rotate the key. Use IAM roles or environment variables.
    references:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html

  # ── GitHub Tokens ──────────────────────────────────────────────

  - id: secrets-github-pat
    name: GitHub personal access token detected
    description: >
      Flags GitHub personal access tokens (ghp_* prefix) in source code.
    descriptions:
      business: >
        A GitHub access token was found in the code. This token can read
        and modify your repositories, create releases, manage teams, and
        more. If leaked, an attacker can inject malicious code into your
        supply chain or steal proprietary source code.
      developer: >
        A ghp_* prefixed token was detected. GitHub PATs grant repo access
        based on the scopes configured at creation. Use GITHUB_TOKEN in CI
        or GitHub App tokens with minimum scopes. Rotate immediately if
        committed.
    rationale: >
      GitHub PATs authenticate as the user who created them with whatever
      scopes were granted. A leaked PAT can push malicious code, create
      releases, access private repos, and modify organization settings.
    severity: error
    tags: [secrets, github, tokens]
    detector:
      capability: gitleaks
      config:
        rule_id: github-pat
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**"]
    fix:
      message: Revoke the token in GitHub settings. Use GITHUB_TOKEN in CI or GitHub Apps.
    references:
      - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens

  - id: secrets-github-fine-grained-pat
    name: GitHub fine-grained personal access token detected
    description: >
      Flags GitHub fine-grained personal access tokens (github_pat_* prefix).
    descriptions:
      business: >
        A GitHub access token was found in the code. Even fine-grained
        tokens with limited scope can still read code, create issues, or
        access CI workflows. Revoke and rotate immediately.
      developer: >
        A github_pat_* token was detected. Fine-grained PATs are scoped to
        specific repos and permissions, but they're still credentials that
        don't belong in source. Use GitHub Actions' built-in GITHUB_TOKEN
        or a GitHub App.
    rationale: >
      Fine-grained PATs are better than classic PATs but are still
      long-lived credentials that must not be committed. They persist in
      git history and grant whatever permissions were configured.
    severity: error
    tags: [secrets, github, tokens]
    detector:
      capability: gitleaks
      config:
        rule_id: github-fine-grained-pat
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**"]
    fix:
      message: Revoke the token. Use GitHub Actions GITHUB_TOKEN or a GitHub App.
    references:
      - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens

  # ── Private Keys ───────────────────────────────────────────────

  - id: secrets-private-key
    name: Private key detected
    description: >
      Flags PEM-encoded private keys (RSA, DSA, EC, OpenSSH) in source code.
    descriptions:
      business: >
        A cryptographic private key was found in the code. Private keys are
        used for encryption, signing, and server authentication (TLS/SSH).
        A leaked private key lets an attacker impersonate your servers,
        decrypt traffic, or sign code as if they were you.
      developer: >
        A PEM-encoded private key was detected (BEGIN RSA/DSA/EC/OPENSSH
        PRIVATE KEY). Never commit private keys. Use a secret store (Vault,
        AWS Secrets Manager) or mount as a Kubernetes secret. Regenerate
        the key pair if committed.
    rationale: >
      Private keys are the most sensitive credential type. A leaked TLS
      private key enables man-in-the-middle attacks on all traffic. A
      leaked SSH key grants server access. A leaked signing key allows
      code/token forgery. Once committed, the key must be considered
      compromised even if the commit is reverted.
    severity: error
    tags: [secrets, private-key, cryptography]
    detector:
      capability: gitleaks
      config:
        rule_id: private-key
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**"]
    fix:
      message: Remove the key and regenerate the key pair. Use a secret store or mounted secrets.
    references:
      - https://owasp.org/www-community/vulnerabilities/Missing_Certificate_Key_Credential

  # ── Generic Patterns ───────────────────────────────────────────

  - id: secrets-generic-api-key
    name: Generic API key detected
    description: >
      Flags strings that match common API key patterns in configuration
      or source code.
    descriptions:
      business: >
        Something that looks like an API key was found in the code. API
        keys grant access to third-party services — payment processors,
        email providers, analytics platforms. A leaked key can be used
        to impersonate your application, access your data, or run up
        usage charges on your account.
      developer: >
        A pattern matching common API key formats was detected. This may
        be a false positive — review the match. If it's a real key, move
        it to environment variables or a secret store.
    rationale: >
      Generic API key patterns catch keys that don't match a specific
      vendor pattern. While false positive rates are higher, the cost of
      missing a real leaked key outweighs the review overhead.
    severity: warning
    tags: [secrets, api-key]
    detector:
      capability: gitleaks
      config:
        rule_id: generic-api-key
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**", "**/*_test.go", "**/*.test.ts"]
    fix:
      message: Move the key to environment variables or a secret store if this is a real credential.
    references:
      - https://github.com/gitleaks/gitleaks

  - id: secrets-generic-password
    name: Hardcoded password detected
    description: >
      Flags strings assigned to variables named password, passwd, secret,
      or similar.
    descriptions:
      business: >
        A hardcoded password was found in the code. Passwords in source
        code end up in version control, CI logs, and container images —
        accessible to anyone with repository access. If this is a
        production password, it must be rotated immediately.
      developer: >
        A variable named password/passwd/secret was assigned a string
        literal. Use environment variables, a vault, or a credential
        provider interface. This detection is heuristic — review the match
        for false positives (test fixtures, documentation strings).
    rationale: >
      Hardcoded passwords are the simplest form of credential leak.
      They persist in git history, appear in CI logs, and are trivially
      searchable. Even internal passwords should never be in source code.
    severity: warning
    tags: [secrets, password]
    detector:
      capability: gitleaks
      config:
        rule_id: generic-password
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**", "**/*_test.go", "**/*.test.ts"]
    fix:
      message: Move the password to environment variables or a secret store.
    references:
      - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password

  # ── JWT ────────────────────────────────────────────────────────

  - id: secrets-jwt
    name: JWT token detected
    description: >
      Flags JWT tokens (eyJ* prefix) found in source code.
    descriptions:
      business: >
        A JSON Web Token was found in the code. JWTs contain encoded user
        identity and permissions. A leaked JWT can be used to impersonate
        the user it represents — accessing their account, data, and
        permissions without knowing their password.
      developer: >
        A base64-encoded JWT (eyJ prefix) was detected. JWTs in source
        are often test tokens, but even expired tokens leak claim
        structures and signing algorithms. Remove them and use dynamic
        token generation in tests.
    rationale: >
      JWTs encode user identity, permissions, and session data. A leaked
      JWT can be replayed if it hasn't expired. Even expired JWTs reveal
      the claim structure, signing algorithm, and potentially the issuer —
      useful for crafting attack tokens.
    severity: error
    tags: [secrets, jwt, tokens]
    detector:
      capability: gitleaks
      config:
        rule_id: jwt
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**", "**/*_test.go", "**/*.test.ts"]
    fix:
      message: Remove the JWT. Use dynamic token generation in tests.
    references:
      - https://jwt.io/introduction

  # ── Communication Platforms ────────────────────────────────────

  - id: secrets-slack-webhook
    name: Slack webhook URL detected
    description: >
      Flags Slack incoming webhook URLs in source code.
    descriptions:
      business: >
        A Slack webhook URL was found in the code. Anyone with this URL
        can post messages to your Slack channel — impersonating your bots,
        sending phishing links to your team, or spamming channels. Webhook
        URLs cannot be scoped or rate-limited.
      developer: >
        A Slack webhook URL (hooks.slack.com) was detected. Regenerate the
        webhook in Slack's app settings and load from environment variables.
        Webhook URLs are bearer tokens — possession equals access.
    rationale: >
      Slack webhook URLs are bearer tokens. Anyone with the URL can post
      arbitrary messages to the configured channel. This enables social
      engineering attacks against your team through a trusted channel.
    severity: error
    tags: [secrets, slack, webhook]
    detector:
      capability: gitleaks
      config:
        rule_id: slack-webhook-url
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**"]
    fix:
      message: Regenerate the webhook and load from environment variables.
    references:
      - https://api.slack.com/messaging/webhooks

  - id: secrets-slack-token
    name: Slack API token detected
    description: >
      Flags Slack bot or user tokens (xoxb-*, xoxp-*) in source code.
    descriptions:
      business: >
        A Slack API token was found in the code. This token can read
        messages, list channels, access files, and manage your Slack
        workspace depending on its scopes. A leaked token is a full
        compromise of your team's communication platform.
      developer: >
        A xoxb/xoxp prefixed Slack token was detected. These are OAuth
        tokens with workspace-level access. Revoke in Slack's admin panel,
        use environment variables, and ensure the bot has minimum required
        scopes.
    rationale: >
      Slack tokens (xoxb for bots, xoxp for users) grant API access to
      your workspace. Depending on scopes, they can read all messages,
      list all users, access files, and modify channel settings.
    severity: error
    tags: [secrets, slack, tokens]
    detector:
      capability: gitleaks
      config:
        rule_id: slack-access-token
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**"]
    fix:
      message: Revoke the token in Slack admin. Use environment variables.
    references:
      - https://api.slack.com/authentication/token-types

  # ── Payment & SaaS ────────────────────────────────────────────

  - id: secrets-stripe-key
    name: Stripe API key detected
    description: >
      Flags Stripe API keys (sk_live_*, rk_live_*) in source code.
    descriptions:
      business: >
        A Stripe payment processing key was found in the code. This key
        can create charges, issue refunds, and access customer payment
        data. A leaked Stripe key is a direct financial liability — an
        attacker can process fraudulent refunds or exfiltrate cardholder
        data, triggering PCI compliance violations.
      developer: >
        A sk_live or rk_live prefixed Stripe key was detected. Rotate
        immediately in the Stripe dashboard. Use restricted keys with
        minimum permissions and load from environment variables.
    rationale: >
      Stripe live keys process real payments. A leaked key enables
      fraudulent charges, refunds, and access to customer payment data.
      This creates both financial liability and PCI DSS compliance
      violations.
    severity: error
    tags: [secrets, stripe, payment, pci]
    detector:
      capability: gitleaks
      config:
        rule_id: stripe-access-token
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**"]
    fix:
      message: Rotate the key in Stripe dashboard. Use restricted keys with minimum permissions.
    references:
      - https://stripe.com/docs/keys

  - id: secrets-sendgrid-key
    name: SendGrid API key detected
    description: >
      Flags SendGrid API keys (SG.*) in source code.
    descriptions:
      business: >
        A SendGrid email API key was found in the code. An attacker with
        this key can send emails from your domain — phishing your
        customers, damaging your brand reputation, and getting your domain
        blacklisted by email providers.
      developer: >
        A SendGrid API key was detected. Rotate in the SendGrid dashboard,
        use API keys with minimum scopes (e.g., send-only), and load from
        environment variables.
    rationale: >
      SendGrid keys authorize email sending from your domain. A leaked key
      enables phishing campaigns that appear to come from your organization,
      damaging brand trust and potentially getting your domain blacklisted.
    severity: error
    tags: [secrets, sendgrid, email]
    detector:
      capability: gitleaks
      config:
        rule_id: sendgrid-api-token
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**"]
    fix:
      message: Rotate the key in SendGrid. Use minimum-scope API keys.
    references:
      - https://docs.sendgrid.com/ui/account-and-settings/api-keys

  # ── Package Registries ─────────────────────────────────────────

  - id: secrets-npm-token
    name: npm access token detected
    description: >
      Flags npm access tokens in source code or .npmrc files.
    descriptions:
      business: >
        An npm registry token was found in the code. This token can publish
        packages under your organization's name. A leaked npm token is a
        supply chain attack vector — an attacker can publish malicious
        versions of your packages that your users will automatically
        download.
      developer: >
        An npm token was detected (often in .npmrc files). Revoke in npm
        account settings, use granular tokens scoped to specific packages,
        and configure CI to use ephemeral tokens via npm automation tokens.
    rationale: >
      npm tokens can publish packages. A compromised token enables supply
      chain attacks — publishing malicious code under your package name
      that downstream users install automatically.
    severity: error
    tags: [secrets, npm, supply-chain]
    detector:
      capability: gitleaks
      config:
        rule_id: npm-access-token
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**"]
    fix:
      message: Revoke the token. Use scoped automation tokens for CI.
    references:
      - https://docs.npmjs.com/about-access-tokens

  # ── Database ───────────────────────────────────────────────────

  - id: secrets-database-url
    name: Database connection string with credentials detected
    description: >
      Flags PostgreSQL, MySQL, or MongoDB connection strings containing
      embedded credentials.
    descriptions:
      business: >
        A database connection string with username and password was found
        in the code. This gives direct access to your database — an
        attacker can read, modify, or delete all your data. Database
        credentials in source code are the most common path to a data
        breach.
      developer: >
        A connection URI with embedded credentials was detected
        (postgres://user:pass@host). Use environment variables for the
        full URI, or better, use IAM database authentication which
        eliminates static passwords entirely.
    rationale: >
      Database connection strings with embedded credentials grant direct
      database access. Unlike API keys, there's often no scope limitation —
      the credentials typically have full read/write access to all tables.
    severity: error
    tags: [secrets, database, credentials]
    detector:
      capability: gitleaks
      config:
        rule_id: postgres-uri
    applies_to: ["**/*"]
    excludes: ["**/vendor/**", "**/node_modules/**", "**/dist/**", "**/.git/**", "**/*_test.go", "**/*.test.ts"]
    fix:
      message: Move the connection string to environment variables. Use IAM auth where possible.
    references:
      - https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-CONNSTRING
