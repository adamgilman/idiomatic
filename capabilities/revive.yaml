# yaml-language-server: $schema=../schemas/capability.schema.json
apiVersion: capabilities.idiomatic.dev/v1alpha1
kind: Capability
metadata:
  name: revive
  version: 1.0.0
  description: revive Go style linter (run via golangci-lint)

spec:
  applies_to_files:
    extensions: [".go"]

  requires:
    binary: golangci-lint
    install: "go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest"

  inputs:
    rule:
      type: string
      required: true
      description: revive rule name (e.g. exported, var-naming, package-comments)
    arguments:
      type: any
      description: Optional arguments forwarded to the revive rule

  run:
    config_file:
      path: "{tmp}/idio-revive.yml"
      template: |
        version: "2"
        linters:
          default: none
          enable: [revive]
        linters-settings:
          revive:
            rules:
        {{- range .Rules }}
              - name: {{ index .Inputs "rule" }}
        {{- with index .Inputs "arguments" }}
                arguments: {{ . | toJson }}
        {{- end }}
        {{- end }}
    argv:
      - run
      - --config
      - "{config_file}"
      - --output.json.path
      - stdout
      - --output.text.path
      - /dev/null
      - --path-mode=abs
      - "{files}"
    timeout: 60s
    ok_exit: [1]
    output: stdout
    files_as_dirs: true

  signal:
    shape: list
    source: stdout
    format: json
    list: Issues
    match_rule_by:
      strategy: by_input
      field: rule
      from: Text
      transform: prefix_before_colon
    fields:
      file: Pos.Filename
      line: Pos.Line
      col: Pos.Column
      message: Text
