# yaml-language-server: $schema=../schemas/capability.schema.json
apiVersion: capabilities.idiomatic.dev/v1alpha1
kind: Capability
metadata:
  name: file-exists
  version: 1.0.0
  description: Per-rule check that a file exists at the project root. Wraps stat; rule supplies the relative path and fire_when.

spec:
  applies_to_files:

  requires:
    binary: stat
    install: "your system package manager (coreutils)"

  inputs:
    path:
      type: string
      required: true
      description: Path relative to the project root
    fire_when:
      type: string
      required: true
      description: |
        Expression evaluated against the scalar signal. Use
        'signal.exit_code != 0' to fire when the file is missing.

  run:
    per: rule
    argv:
      - "{project}/{{ .Inputs.path }}"
    timeout: 5s
    ok_exit: [0, 1]
    output: stdout

  signal:
    shape: scalar
    scalar_fields:
      stdout:    { from: stdout, transform: trim }
      stderr:    { from: stderr, transform: trim }
      exit_code: { from: exit }
    fixed_file: "{project}/{{ .Inputs.path }}"
