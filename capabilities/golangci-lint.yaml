# yaml-language-server: $schema=../schemas/capability.schema.json
apiVersion: capabilities.idiomatic.dev/v1alpha1
kind: Capability
metadata:
  name: golangci-lint
  version: 1.0.0
  description: Multi-linter aggregator for Go — runs only the linters the pack asks for, deduplicates them, and routes findings back to rules

spec:
  applies_to_files:
    extensions: [".go"]

  requires:
    binary: golangci-lint
    install: "go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest"

  inputs:
    linter:
      type: string
      required: true
      description: golangci-lint linter name (e.g. gocritic, govet)
    rule:
      type: string
      description: Sub-rule name used to disambiguate when multiple pack rules share a linter (substring-matched against the issue text)
    settings:
      type: any
      description: Linter-specific settings merged into linters-settings.<linter>

  run:
    per: batch
    config_file:
      path: "{tmp}/idio-golangci-lint.yml"
      # Build a deduplicated linter list and merge per-linter settings.
      template: |
        linters:
          disable-all: true
          enable:
        {{- $linters := list }}
        {{- range .Rules }}{{ $linters = append $linters (index .Inputs "linter") }}{{ end }}
        {{- range $linters | uniq | sortAlpha }}
            - {{ . }}
        {{- end }}
        linters-settings:
        {{- range $linters | uniq | sortAlpha }}
        {{- $name := . }}
          {{ $name }}:
        {{- range $.Rules }}
        {{- if eq (index .Inputs "linter") $name }}{{ with index .Inputs "settings" }}
        {{ . | toYaml | indent 4 }}{{ end }}{{ end }}
        {{- end }}
        {{- end }}
    argv:
      - run
      - --config
      - "{config_file}"
      - --output.json.path
      - stdout
      - --output.text.path
      - /dev/null
      - "{files}"
    timeout: 120s
    ok_exit: [1]
    output: stdout
    files_as_dirs: true

  signal:
    shape: list
    source: stdout
    format: json
    list: Issues
    match_rule_by:
      strategy: linter_contains
      field: linter            # which rule input names the linter
      subrule_field: rule      # which rule input names the sub-rule for disambiguation
      from: FromLinter
      match_in: Text
    fields:
      file: Pos.Filename
      line: Pos.Line
      col: Pos.Column
      message: Text
